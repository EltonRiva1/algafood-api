<!doctype html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Autorização de acesso</title>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>

<body class="bg-light">

	<div class="container py-5" style="max-width: 720px">

		<h1 class="h3 mb-3">Autorização de acesso</h1>

		<p>
			A aplicação
			<strong th:text="${clientName}">Cliente OAuth2</strong>
			deseja acessar sua conta.
		</p>

		<form th:action="@{/oauth2/authorize}" method="post">

			<input type="hidden" name="client_id" th:value="${clientId}">

			<input type="hidden" name="state" th:value="${state}">

			<div th:if="${!#sets.isEmpty(previouslyApprovedScopes)}" class="alert alert-secondary">

				<strong>Permissões já concedidas:</strong>

				<ul class="mb-0 mt-2">
					<li th:each="scope : ${previouslyApprovedScopes}">
						<span th:text="${scope}">READ</span>
					</li>
				</ul>
			</div>

			<div th:if="${!#sets.isEmpty(scopes)}">

				<p><strong>Permissões solicitadas:</strong></p>

				<div class="form-check mb-2" th:each="scope : ${scopes}">

					<input class="form-check-input" type="checkbox" name="scope" th:id="${'scope-' + scope}"
						th:value="${scope}" checked>

					<label class="form-check-label" th:for="${'scope-' + scope}">

						<span th:text="${scope}">READ</span>
					</label>
				</div>
			</div>

			<button class="btn btn-primary mt-3" type="submit">
				Autorizar
			</button>
		</form>

		<div class="mt-4">
			<a th:href="@{/oauth2/consents}">
				Gerenciar aplicações autorizadas
			</a>
		</div>

	</div>

</body>

</html>
