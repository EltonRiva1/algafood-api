spring.jpa.show-sql=false

spring.flyway.locations=classpath:db/migration

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}

algafood.email.impl=smtp
algafood.email.remetente=${MAIL_FROM}

algafood.auth-server.issuer=${AUTH_SERVER_ISSUER}

algafood.jwt.keystore.jks-location=${JWT_KEYSTORE_LOCATION}
algafood.jwt.keystore.password=${JWT_KEYSTORE_PASSWORD}
algafood.jwt.keystore.keypair-alias=${JWT_KEYSTORE_ALIAS:algafood}

algafood.storage.local.diretorio-fotos=${ALGAFOOD_STORAGE_LOCAL_DIRETORIO_FOTOS}